<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="./">
<title>Account — 13AM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif+SC:wght@300;400;500;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;
  --bg-soft:#121010;
  --text:#e8e0d8;
  --text-dim:#6a655f;
  --text-faint:#3a3530;
  --line:#1f1c18;
  --accent:#8b0000;
  --serif:'Fraunces','Noto Serif SC',serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ===== 顶部三段式导航 ===== */
.topbar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 48px;
  height:34px;
  background:rgba(180,180,180,0.05);
  backdrop-filter:blur(12px) saturate(1.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  overflow:visible;
}
.back-btn{
  position:absolute;
  left:48px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:0.1em;
  cursor:pointer;
  padding:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  transition:color 0.3s ease;
}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{
  position:absolute;
  right:48px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  letter-spacing:0.25em;
  color:var(--text-dim);
  font-weight:300;
}
.topbar-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  cursor:pointer;
}
.topbar-logo img{
  height:46px;
  width:auto;
  opacity:0.85;
  transition:opacity 0.4s ease,transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform,opacity;
}
.topbar-logo:hover img{
  opacity:1;
  transform:scale(1.26);
}

/* ===== 主体 ===== */
.wrap{
  max-width:960px;
  margin:0 auto;
  padding:140px 48px 80px;
}

.page-label{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:60px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}
.page-label .num{
  font-size:12px;
  color:var(--text-faint);
  letter-spacing:0.1em;
}
.page-label .title{
  font-size:32px;
  font-weight:400;
  letter-spacing:0.04em;
}
.page-label .desc{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.1em;
  margin-left:auto;
  font-style:italic;
}

/* ===== 卡片通用 ===== */
.card{
  background:var(--bg-soft);
  border:1px solid var(--line);
  padding:40px;
  margin-bottom:28px;
  position:relative;
}
.card-h{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:28px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.card-h h2{
  font-size:20px;
  font-weight:400;
  letter-spacing:0.08em;
}
.card-h .tag{
  font-size:11px;
  letter-spacing:0.2em;
  color:var(--text-faint);
  text-transform:uppercase;
}

/* ===== 基础信息 ===== */
.profile{
  display:flex;
  align-items:center;
  gap:28px;
}
.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:linear-gradient(135deg,#1a1514,#2a1d1b);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--serif);
  font-size:36px;
  font-weight:300;
  color:var(--text-dim);
  letter-spacing:0;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.profile-info{
  flex:1;
  min-width:0;
}
.profile-info .name{
  font-size:26px;
  font-weight:500;
  letter-spacing:0.04em;
  margin-bottom:6px;
}
.profile-info .email{
  font-size:13px;
  color:var(--text-dim);
  letter-spacing:0.06em;
  margin-bottom:8px;
}
.profile-info .extras{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
}
.profile-info .extras span{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.06em;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.profile-info .extras span b{
  color:var(--text);
  font-weight:400;
}
.profile-info .meta{
  margin-top:10px;
  font-size:11px;
  letter-spacing:0.16em;
  color:var(--text-faint);
  text-transform:uppercase;
}

/* ===== 订单占位 ===== */
.order-empty{
  text-align:center;
  padding:60px 24px 40px;
}
.order-empty .icon{
  width:48px;height:48px;
  margin:0 auto 20px;
  opacity:0.3;
  stroke:var(--text);fill:none;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;
}
.order-empty .msg{
  font-size:15px;
  color:var(--text-dim);
  font-style:italic;
  margin-bottom:6px;
}
.order-empty .sub{
  font-size:12px;
  color:var(--text-faint);
  letter-spacing:0.1em;
}

/* ===== 购物车入口 ===== */
.cart-entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  gap:20px;
}
.cart-entry .left{
  display:flex;
  align-items:center;
  gap:18px;
  min-width:0;
}
.cart-entry .left svg{
  width:36px;height:36px;
  stroke:var(--text-dim);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;
}
.cart-entry .left .txt .main{
  font-size:16px;
  font-weight:500;
  letter-spacing:0.04em;
  margin-bottom:4px;
}
.cart-entry .left .txt .sub{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.08em;
}
.cart-entry .count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  font-size:11px;
  letter-spacing:0;
  margin-left:6px;
}
.cart-entry a.btn{
  display:inline-block;
  padding:12px 28px;
  border:1px solid var(--text-faint);
  color:var(--text);
  text-decoration:none;
  font-size:12px;
  letter-spacing:0.2em;
  transition:all 0.3s ease;
  flex-shrink:0;
}
.cart-entry a.btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* ===== 编辑模式 ===== */
.edit-btn{
  background:none;
  border:none;
  color:var(--text-faint);
  font-family:var(--serif);
  font-size:11px;
  letter-spacing:0.2em;
  cursor:pointer;
  padding:4px 10px;
  transition:color 0.3s ease;
  text-transform:uppercase;
}
.edit-btn:hover{ color:var(--accent); }
.edit-form{
  margin-top:18px;
  padding-top:22px;
  border-top:1px solid var(--line);
  display:none;
  animation:fadein 0.3s ease;
}
.edit-form.open{ display:block; }
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.field{
  margin-bottom:16px;
}
.field label{
  display:block;
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--text-faint);
  text-transform:uppercase;
  margin-bottom:8px;
}
.field input{
  width:100%;
  padding:12px 14px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--serif);
  font-size:14px;
  letter-spacing:0.04em;
  outline:none;
  transition:border-color 0.3s ease;
}
.field select{
  width:100%;
  padding:12px 40px 12px 14px;
  background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%236a655f' stroke-width='1.3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--serif);
  font-size:14px;
  letter-spacing:0.04em;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  transition:border-color 0.3s ease;
  cursor:pointer;
}
.field select:focus{ border-color:var(--accent); }
.field input:focus{ border-color:var(--accent); }
.field input[readonly]{
  color:var(--text-dim);
  background:transparent;
  cursor:not-allowed;
}
.field input[type=file]{
  padding:0;
  border:none;
  background:transparent;
  color:var(--text-dim);
  font-size:12px;
}
.field input[type=file]::file-selector-button{
  padding:8px 14px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--serif);
  font-size:11px;
  letter-spacing:0.14em;
  cursor:pointer;
  margin-right:12px;
  transition:all 0.3s ease;
}
.field input[type=file]::file-selector-button:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* 头像编辑区 */
.avatar-edit{
  display:flex;
  align-items:center;
  gap:20px;
  padding:16px 18px;
  background:var(--bg);
  border:1px solid var(--line);
  margin-bottom:20px;
}
.avatar-edit .avatar-mini{
  width:64px;height:64px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,#1a1514,#2a1d1b);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:300;color:var(--text-dim);
  flex-shrink:0;
}
.avatar-edit .avatar-mini img{ width:100%;height:100%;object-fit:cover;display:block; }
.avatar-edit .avatar-actions{
  flex:1;min-width:0;
}
.avatar-edit .avatar-actions .title{
  font-size:12px;letter-spacing:0.16em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;
}
.avatar-edit .avatar-actions .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar-edit .link-btn{
  background:none;border:none;
  padding:8px 14px;
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--serif);
  font-size:11px;
  letter-spacing:0.14em;
  cursor:pointer;
  transition:all 0.3s ease;
}
.avatar-edit .link-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}
.field .hint{
  margin-top:6px;
  font-size:11px;
  color:var(--text-faint);
  letter-spacing:0.06em;
}
.field-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:16px;
}
.field-row .cell{
  min-width:0;
}
.field-row .cell label{
  display:block;
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--text-faint);
  text-transform:uppercase;
  margin-bottom:8px;
}
.field-row .cell select{
  width:100%;
  padding:12px 40px 12px 14px;
  background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%236a655f' stroke-width='1.3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--serif);
  font-size:14px;
  letter-spacing:0.04em;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  transition:border-color 0.3s ease;
  cursor:pointer;
}
.field-row .cell select:focus{ border-color:var(--accent); }
.field-row .cell select:disabled{
  opacity:0.45;
  cursor:not-allowed;
}
@media (max-width:520px){
  .field-row{ grid-template-columns:1fr; }
}
.edit-actions{
  display:flex;
  gap:12px;
  margin-top:8px;
}
.edit-actions button{
  padding:10px 22px;
  font-family:var(--serif);
  font-size:11px;
  letter-spacing:0.2em;
  cursor:pointer;
  transition:all 0.3s ease;
}
.btn-save{
  background:var(--accent);
  border:1px solid var(--accent);
  color:#fff;
}
.btn-save:hover{ background:transparent; color:var(--accent); }
.btn-save:disabled{
  opacity:0.5;
  cursor:not-allowed;
}
.btn-cancel{
  background:transparent;
  border:1px solid var(--text-faint);
  color:var(--text-dim);
}
.btn-cancel:hover{
  border-color:var(--text);
  color:var(--text);
}
.msg-bar{
  margin-top:14px;
  padding:10px 14px;
  font-size:12px;
  letter-spacing:0.06em;
  display:none;
}
.msg-bar.ok{
  display:block;
  border:1px solid rgba(139,0,0,0.3);
  color:var(--accent);
  background:rgba(139,0,0,0.06);
}
.msg-bar.err{
  display:block;
  border:1px solid rgba(200,60,60,0.3);
  color:#c83c3c;
  background:rgba(200,60,60,0.06);
}

/* ===== 底部操作 ===== */
.actions{
  margin-top:48px;
  display:flex;
  gap:16px;
  justify-content:flex-end;
}
.btn-outline{
  padding:12px 28px;
  background:transparent;
  border:1px solid var(--text-faint);
  color:var(--text-dim);
  font-family:var(--serif);
  font-size:12px;
  letter-spacing:0.2em;
  cursor:pointer;
  transition:all 0.3s ease;
}
.btn-outline:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* ===== 加载态 ===== */
.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:300px;
  color:var(--text-faint);
  font-size:13px;
  letter-spacing:0.2em;
}
.loading::after{
  content:'';
  display:inline-block;
  width:12px;height:12px;
  border:1px solid var(--text-faint);
  border-top-color:transparent;
  border-radius:50%;
  margin-left:12px;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .topbar{padding:0 20px;height:32px}
  .back-btn{left:20px;font-size:11px}
  .topbar-title{right:20px;font-size:11px;letter-spacing:0.2em}
  .topbar-logo img{height:40px}
  .wrap{padding:120px 24px 60px}
  .page-label{margin-bottom:40px;display:block}
  .page-label .title{font-size:24px}
  .page-label .desc{margin-left:0;margin-top:8px;display:block}
  .card{padding:24px}
  .profile{flex-direction:column;text-align:center}
  .profile-info{width:100%}
  .actions{justify-content:center;flex-wrap:wrap}
  .cart-entry{flex-direction:column;align-items:flex-start}
}
@media (max-width:480px){
  .wrap{padding:110px 16px 48px}
  .card{padding:20px}
  .card-h{display:block}
  .card-h h2{font-size:16px;margin-bottom:8px}
}
</style>
</head>
<body>

<!-- 顶部导航三段式 -->
<header class="topbar">
  <button class="back-btn" onclick="history.length>1?history.back():location.href='index.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    BACK
  </button>
  <a class="topbar-logo" href="index.html" aria-label="13AM Home">
    <img src="assets/logo-13am.png" alt="13AM">
  </a>
  <div class="topbar-title">ACCOUNT</div>
</header>

<main class="wrap" id="mainContent">
  <div class="loading">LOADING</div>
</main>

<script src="assets/js/supabase.js"></script>
<script>
/* ===== 工具 ===== */
function getLocalCartCount(){
  try{
    const c = JSON.parse(localStorage.getItem('13am_cart') || '[]');

  }catch(e){ return 0; }
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    '湖南 Hunan': ['长沙市','株洲市','湘潭市','衡阳市','岳阳市','常德市','邵阳市','郴州市','益阳市','永州市','娄底市','张家界市'],

/* ===== 读取展示区的地区字符串 ===== */
function formatRegionDisplay(loc){
  if(!loc) return '';
  if(typeof loc === 'string') return loc; // 兼容旧格式（纯字符串）
  if(typeof loc === 'object'){
    const parts = [];
    if(loc.country_name) parts.push(loc.country_name);
    if(loc.region) parts.push(loc.region);
    if(loc.city) parts.push(loc.city);
    return parts.filter(Boolean).join(' · ');
  }
  return '';
}

/* ===== 把地区对象写入表单 ===== */
function applyCascadeValues(loc){
  const cEl = document.getElementById('fCountry');
  const rEl = document.getElementById('fState');
  const yEl = document.getElementById('fCity');
  if(!cEl || !rEl || !yEl) return;
  // fill country
  const cc = (loc && typeof loc==='object') ? (loc.country_code || '') : '';
  cEl.value = cc;
  refreshRegions();
  const region = (loc && typeof loc==='object') ? (loc.region || '') : '';
  rEl.value = region;
  refreshCities();
  const city = (loc && typeof loc==='object') ? (loc.city || '') : '';
  yEl.value = city;
}

/* ===== 把表单三级值提取为对象 ===== */
function collectCascade(){
  const cc = document.getElementById('fCountry').value;
  const region = document.getElementById('fState').value;
  const city = document.getElementById('fCity').value;
  const country_name = (GEO_DATA[cc] && GEO_DATA[cc].name) || '';
  return { country_code: cc, country_name, region, city };
}

/* ===== 刷新"省/州"下拉 ===== */
function refreshRegions(){
  const cEl = document.getElementById('fCountry');
  const rEl = document.getElementById('fState');
  const yEl = document.getElementById('fCity');
  if(!cEl || !rEl || !yEl) return;
  const cc = cEl.value;
  const regions = (cc && GEO_DATA[cc] && GEO_DATA[cc].regions) ? Object.keys(GEO_DATA[cc].regions) : [];
  rEl.innerHTML = '<option value="">— Select state/province —</option>' +
    regions.map(r=>`<option value="${escapeAttr(r)}">${escapeHtml(r)}</option>`).join('');
  rEl.disabled = !cc;
  yEl.innerHTML = '<option value="">— Select city —</option>';
  yEl.disabled = true;
}

/* ===== 刷新"城市"下拉 ===== */
function refreshCities(){
  const cEl = document.getElementById('fCountry');
  const rEl = document.getElementById('fState');
  const yEl = document.getElementById('fCity');
  if(!cEl || !rEl || !yEl) return;
  const cc = cEl.value, region = rEl.value;
  if(!cc || !region){
    yEl.innerHTML = '<option value="">— Select city —</option>';
    yEl.disabled = true;
    return;
  }
  const cities = (GEO_DATA[cc] && GEO_DATA[cc].regions && GEO_DATA[cc].regions[region]) || [];
  yEl.innerHTML = '<option value="">— Select city —</option>' +
    cities.map(c=>`<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  yEl.disabled = false;
}

/* ===== 渲染账户页 ===== */
async function renderAccount(){
  const root = document.getElementById('mainContent');
  if(!window.supabaseAuth){
    root.innerHTML = '<div class="empty"><div class="msg">Auth service unavailable</div></div>';
    return;
  }
  await window.supabaseAuth.initSupabase();
  const state = window.supabaseAuth.getAuthState();
  if(!state.loggedIn || !state.user){
    const back = encodeURIComponent('account.html');
    location.replace('login.html?redirect='+back);
    return;
  }

  currentUser = state.user;
  editAvatarData = null;
  paint();
}

      </div>
      <div class="profile">

                <input id="fAvatar" type="file" accept="image/*" onchange="onAvatarFile(this)" style="position:absolute;inset:0;opacity:0;cursor:pointer">

        <div class="field">

          <label for="fGender">Gender</label>

            <select id="fCountry" name="country" onchange="refreshRegions()">
              <option value="">— Select country —</option>

function escapeAttr(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== 编辑态 ===== */
function openEdit(){
  document.getElementById('editForm').classList.add('open');
  const btn = document.getElementById('editToggle');
  btn.textContent = 'CLOSE';
  btn.removeEventListener('click', openEdit);
  btn.addEventListener('click', cancelEdit);
  document.getElementById('fName').focus();
}
function cancelEdit(){
  const f = document.getElementById('editForm');
  if(!f) return;
  f.classList.remove('open');
  const msg = document.getElementById('saveMsg');
  if(msg){ msg.className='msg-bar'; msg.textContent=''; }
  // 重置编辑态
  editAvatarData = null;
  // 还原各字段
  const md = currentUser.user_metadata || {};
  const nameEl = document.getElementById('fName');
  if(nameEl) nameEl.value = md.name || '';
  const gEl = document.getElementById('fGender');
  if(gEl) gEl.value = md.gender || '';
  // 还原三级地区
  applyCascadeValues(md.location || null);
  const pEl = document.getElementById('fPhone');
  if(pEl) pEl.value = md.phone || '';
  const fileEl = document.getElementById('fAvatar');
  if(fileEl) fileEl.value = '';
  // 头像预览还原
  const prev = document.getElementById('avatarPreview');
  const name = md.name || currentUser.email?.split('@')[0] || 'U';
  const initials = (name.trim().slice(0,1)||'U').toUpperCase();
  if(prev) prev.innerHTML = md.avatar_url ? `<img src="${escapeAttr(md.avatar_url)}" alt="">` : escapeHtml(initials);
  const rmBtn = document.getElementById('removeAvatarBtn');
  if(rmBtn){
    if(md.avatar_url){
      rmBtn.disabled = false;
      rmBtn.style.removeProperty('opacity');
      rmBtn.style.removeProperty('cursor');
    } else {
      rmBtn.disabled = true;
      rmBtn.style.opacity = '0.4';
      rmBtn.style.cursor = 'not-allowed';
    }
  }
  // 还原 toggle
  const btn = document.getElementById('editToggle');
  if(btn){
    btn.textContent = 'EDIT';
    btn.removeEventListener('click', cancelEdit);
    btn.addEventListener('click', openEdit);
  }
}

/* ===== 头像：选择文件 → 预览（含临时占位，save 才会写服务器） ===== */
async function onAvatarFile(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  if(!/^image\//.test(file.type)){
    alert('Please upload an image file.');
    input.value = '';
    return;
  }
  if(file.size > 6 * 1024 * 1024){
    alert('Image too large. Max 6MB.');
    input.value = '';
    return;
  }
  try{
    const dataUrl = await compressAvatar(file, 512, 0.85);
    editAvatarData = dataUrl;
    const prev = document.getElementById('avatarPreview');
    if(prev) prev.innerHTML = `<img src="${escapeAttr(dataUrl)}" alt="">`;
    const rmBtn = document.getElementById('removeAvatarBtn');
    if(rmBtn){
      rmBtn.disabled = false;
      rmBtn.style.removeProperty('opacity');
      rmBtn.style.removeProperty('cursor');
    }
  }catch(err){
    alert('Image processing failed: ' + (err.message || err));
    input.value = '';
  }
}
function removeAvatar(){
  // 两种含义：
  //  - 如果本地正在编辑（editAvatarData 有内容），表示撤销刚上传的，回到原有值
  //  - 如果没有本地编辑内容（即原有 md 里有 avatar），表示希望彻底删除头像
  if(editAvatarData){
    editAvatarData = null;
    // 预览还原为"当前数据库里的"
    const md = currentUser.user_metadata || {};
    const prev = document.getElementById('avatarPreview');
    const name = md.name || currentUser.email?.split('@')[0] || 'U';
    const initials = (name.trim().slice(0,1)||'U').toUpperCase();
    if(prev) prev.innerHTML = md.avatar_url ? `<img src="${escapeAttr(md.avatar_url)}" alt="">` : escapeHtml(initials);
    // 如果原来没有头像，REMOVE 按钮回到禁用
    const rmBtn = document.getElementById('removeAvatarBtn');
    if(rmBtn && !md.avatar_url){
      rmBtn.disabled = true;
      rmBtn.style.opacity='0.4';rmBtn.style.cursor='not-allowed';
    }
    const fileEl = document.getElementById('fAvatar');
    if(fileEl) fileEl.value = '';
  } else {
    if(!confirm('Remove your avatar? You can upload a new one anytime.')) return;
    editAvatarData = '__REMOVE__'; // 哨兵
    const name = (currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'U').trim().slice(0,1).toUpperCase();
    const prev = document.getElementById('avatarPreview');
    if(prev) prev.innerHTML = escapeHtml(name);
    const rmBtn = document.getElementById('removeAvatarBtn');
    if(rmBtn){ rmBtn.disabled = true; rmBtn.style.opacity='0.4'; rmBtn.style.cursor='not-allowed'; }
    const fileEl = document.getElementById('fAvatar');
    if(fileEl) fileEl.value = '';
  }
}

/* ===== 头像压缩：File → base64 dataURL ===== */
function compressAvatar(file, maxSize=512, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('File read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Image decode failed'));
      img.onload = ()=>{
        // 中心裁剪正方形后缩放到 maxSize
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size)/2, sy = (img.height - size)/2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, size, size, 0, 0, maxSize, maxSize);
        const out = file.type === 'image/png' && !file.name.toLowerCase().endsWith('.jpg')
          ? canvas.toDataURL('image/png')
          : canvas.toDataURL('image/jpeg', quality);
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===== 保存 ===== */
async function saveProfile(e){
  e.preventDefault();
  const msg = document.getElementById('saveMsg');
  const btn = document.getElementById('saveBtn');
  const fName = document.getElementById('fName');
  const fGender = document.getElementById('fGender');
  const fPhone = document.getElementById('fPhone');

  const newName = (fName.value || '').trim().slice(0,20); // 硬上限 20 字符
  if(!newName){
    msg.className='msg-bar err';
    msg.textContent = 'Name cannot be empty.';
    return false;
  }
  const gender = (fGender.value || '');
  // 收集三级联动结果 {country_code, country_name, region, city}，若无则清空 location
  const locationPatch = collectCascade();
  const phone = (fPhone.value || '').trim().slice(0,24);

  // 构造 user_metadata 新数据，合并 avatar 变更
  const md = { ...(currentUser.user_metadata||{}) };
  md.name = newName;
  md.gender = gender;
  md.phone = phone;
  if(locationPatch){
    md.location = locationPatch;
    delete md.region; // 迁移：清除旧字符串字段
  } else {
    delete md.location;
  }
  if(editAvatarData === '__REMOVE__'){
    delete md.avatar_url;
  } else if(typeof editAvatarData === 'string' && editAvatarData.startsWith('data:image')){
    md.avatar_url = editAvatarData;
  }

  btn.disabled = true;
  btn.textContent = 'SAVING…';
  msg.className='msg-bar';
  msg.textContent='';
  try{
    // 调用一次 updateUser：avatar 直接放 user_metadata，而不是走 Supabase Storage
    await window.supabaseAuth.updateUserMetadata(md);
    // 刷新 currentUser
    const s = window.supabaseAuth.getAuthState();
    if(s.user) currentUser = s.user;
    editAvatarData = null;
    paint();
    showToast('Profile updated');
    try{ localStorage.setItem('13am_auth_refresh', Date.now().toString()); }catch(_){}
  }catch(err){
    msg.className='msg-bar err';
    msg.textContent = err.message || 'Save failed';
    btn.disabled = false;
    btn.textContent = 'SAVE';
  }
  return false;
}

/* ===== 轻提示 ===== */
function showToast(text){
  const old = document.getElementById('toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.textContent = text;
  t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 24px;background:rgba(139,0,0,0.9);color:#fff;font-family:var(--serif);font-size:12px;letter-spacing:0.15em;backdrop-filter:blur(12px);animation:toastIn 0.35s ease, toastOut 0.35s ease 2.1s forwards;';
  if(!document.getElementById('toastStyle')){
    const s = document.createElement('style');
    s.id='toastStyle';
    s.textContent='@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes toastOut{to{opacity:0;transform:translate(-50%,-12px)}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2600);
}

async function doSignOut(){
  if(!confirm('确定退出登录？')) return;
  try{
    await window.supabaseAuth.signOut();
    location.href = 'index.html';
  }catch(e){
    alert(e.message || 'Sign out failed');
  }
}

document.addEventListener('DOMContentLoaded', renderAccount);

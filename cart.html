<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="./">
<title>Cart — 13AM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif+SC:wght@300;400;500;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;
  --bg-soft:#121010;
  --text:#e8e0d8;
  --text-dim:#6a655f;
  --text-faint:#3a3530;
  --line:#1f1c18;
  --accent:#8b0000;
  --serif:'Fraunces','Noto Serif SC',serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* 顶部返回条 */
.topbar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 48px;
  height:34px;
  background:rgba(180,180,180,0.05);
  backdrop-filter:blur(12px) saturate(1.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  overflow:visible;
}
.back-btn{
  position:absolute;
  left:48px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:0.1em;
  cursor:pointer;
  padding:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  transition:color 0.3s ease;
}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{
  position:absolute;
  right:48px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  letter-spacing:0.25em;
  color:var(--text-dim);
  font-weight:300;
}

.topbar-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  cursor:pointer;
}
.topbar-logo img{
  height:46px;
  width:auto;
  opacity:0.85;
  transition:opacity 0.4s ease,transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform,opacity;
}
.topbar-logo:hover img{
  opacity:1;
  transform:scale(1.26);
}

/* 主体 */
.wrap{
  max-width:960px;
  margin:0 auto;
  padding:140px 48px 80px;
}

.page-label{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:60px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}
.page-label .num{
  font-size:12px;
  color:var(--text-faint);
  letter-spacing:0.1em;
}
.page-label .title{
  font-size:32px;
  font-weight:400;
  letter-spacing:0.04em;
}
.page-label .desc{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.1em;
  margin-left:auto;
  font-style:italic;
}

/* 空状态 */
.empty{
  text-align:center;
  padding:120px 24px;
}
.empty .icon{
  width:60px;
  height:60px;
  margin:0 auto 32px;
  opacity:0.25;
  stroke:var(--text);
  fill:none;
  stroke-width:1;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.empty .msg{
  font-size:18px;
  font-style:italic;
  color:var(--text-dim);
  margin-bottom:8px;
}
.empty .sub{
  font-size:13px;
  color:var(--text-faint);
  letter-spacing:0.1em;
  margin-bottom:40px;
}
.empty a{
  display:inline-block;
  padding:12px 32px;
  border:1px solid var(--line);
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  letter-spacing:0.15em;
  transition:all 0.3s ease;
}
.empty a:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* 商品列表（占位结构） */
.cart-list{
  display:none;
  flex-direction:column;
  gap:0;
}
.cart-item{
  display:grid;
  grid-template-columns:80px 1fr auto auto;
  gap:24px;
  align-items:center;
  padding:24px 0;
  border-bottom:1px solid var(--line);
}
.cart-item img{
  width:80px;
  height:100px;
  object-fit:cover;
  filter:brightness(0.9);
}
.cart-item .name{
  font-size:16px;
  color:var(--text);
}
.cart-item .tag{
  font-size:11px;
  color:var(--accent);
  letter-spacing:0.2em;
  margin-top:4px;
  opacity:0.7;
}
.cart-item .qty{
  font-size:13px;
  color:var(--text-dim);
  font-feature-settings:"tnum";
}
.cart-item .qty-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px;
  width:fit-content;
}
.cart-item .qty-btn{
  width:26px;height:26px;
  border-radius:50%;
  border:none;background:transparent;color:var(--text-dim);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
  transition:background 0.2s ease,color 0.2s ease;
}
.cart-item .qty-btn:hover{ background:rgba(0,0,0,0.05); color:var(--text); }
.cart-item .qty-num{
  min-width:22px;text-align:center;
  font-size:13px;color:var(--text);font-feature-settings:"tnum";
}
.cart-item .price{
  font-size:15px;
  color:var(--text);
  font-feature-settings:"tnum";
}
.cart-item .remove{
  background:none;
  border:none;
  color:var(--text-faint);
  cursor:pointer;
  font-family:var(--serif);
  font-size:12px;
  transition:color 0.3s ease;
}
.cart-item .remove:hover{color:var(--accent)}

/* 合计 */
.cart-total{
  display:none;
  margin-top:40px;
  padding-top:24px;
  border-top:1px solid var(--line);
  text-align:right;
}
.cart-total .label{
  font-size:13px;
  color:var(--text-dim);
  letter-spacing:0.15em;
  margin-right:16px;
}
.cart-total .amount{
  font-size:24px;
  color:var(--text);
  font-feature-settings:"tnum";
}
.checkout-btn{
  display:inline-block;
  padding:14px 40px;
  background:var(--accent);
  color:var(--bg);
  border:none;
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:0.2em;
  cursor:pointer;
  transition:all 0.3s ease;
  white-space:nowrap;
}
.checkout-btn:hover{
  background:var(--text);
}
.cart-actions{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
}
.checkout-btn.clear-btn{
  background:transparent;
  color:var(--text-dim);
  border:1px solid var(--line);
}
.checkout-btn.clear-btn:hover{
  color:var(--accent);
  border-color:var(--accent);
  background:transparent;
}

@media (max-width:768px){
  .topbar{padding:0 24px}
  .back-btn{left:24px}
  .wrap{padding:100px 24px 60px}
  .cart-item{grid-template-columns:60px 1fr;gap:16px}
  .cart-item .qty,.cart-item .price,.cart-item .remove{grid-column:2}
}

/* ========== 到货预留弹窗 ========== */
.reserve-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s ease;
}
.reserve-overlay.show{opacity:1;pointer-events:auto;}
.reserve-modal{
  width:90%;max-width:520px;max-height:85vh;overflow-y:auto;
  background:var(--bg,#0c0c0c);border:1px solid rgba(255,255,255,0.08);
  border-radius:4px;padding:32px 28px;
  transform:translateY(20px);transition:transform 0.3s ease;
}
.reserve-overlay.show .reserve-modal{transform:translateY(0);}
.reserve-modal h2{
  font-family:var(--serif);font-size:1.5rem;font-weight:500;
  margin:0 0 4px;letter-spacing:0.02em;
}
.reserve-modal .reserve-sub{
  font-size:0.75rem;letter-spacing:0.1em;color:var(--text-dim);
  margin-bottom:24px;text-transform:uppercase;
}
.reserve-summary{
  border:1px solid rgba(255,255,255,0.06);border-radius:4px;
  padding:12px 16px;margin-bottom:20px;
}
.reserve-summary .rs-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;font-size:0.85rem;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.reserve-summary .rs-item:last-child{border-bottom:none;}
.reserve-summary .rs-name{flex:1;}
.reserve-summary .rs-meta{color:var(--text-dim);font-size:0.75rem;margin-left:8px;}
.reserve-summary .rs-qty{color:var(--text-dim);margin-left:12px;}
.reserve-field{margin-bottom:16px;}
.reserve-field label{
  display:block;font-size:0.7rem;letter-spacing:0.1em;
  color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;
}
.reserve-field input,.reserve-field textarea{
  width:100%;background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);border-radius:3px;
  padding:10px 12px;color:var(--text);font-family:inherit;font-size:0.9rem;
  outline:none;transition:border-color 0.2s;
}
.reserve-field input:focus,.reserve-field textarea:focus{
  border-color:rgba(255,255,255,0.25);
}
.reserve-field textarea{resize:vertical;min-height:60px;}
.reserve-actions{
  display:flex;gap:12px;margin-top:24px;
}
.reserve-actions button{
  flex:1;padding:12px;border:none;border-radius:3px;
  font-family:var(--serif);font-size:0.85rem;letter-spacing:0.05em;
  cursor:pointer;transition:opacity 0.2s;
}
.reserve-actions .btn-cancel{
  background:transparent;border:1px solid rgba(255,255,255,0.15);
  color:var(--text-dim);
}
.reserve-actions .btn-cancel:hover{color:var(--text);}
.reserve-actions .btn-submit{
  background:var(--text,#fff);color:var(--bg,#0c0c0c);font-weight:500;
}
.reserve-actions .btn-submit:hover{opacity:0.85;}
.reserve-actions .btn-submit:disabled{opacity:0.4;cursor:not-allowed;}
.reserve-success{
  text-align:center;padding:20px 0;
}
.reserve-success .check{
  width:48px;height:48px;margin:0 auto 16px;
  border-radius:50%;border:1px solid var(--text);
  display:flex;align-items:center;justify-content:center;
}
.reserve-success .check svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:2;}
.reserve-success h3{
  font-family:var(--serif);font-size:1.2rem;font-weight:500;
  margin:0 0 8px;
}
.reserve-success p{
  font-size:0.8rem;color:var(--text-dim);margin:0 0 24px;
  line-height:1.6;
}
@media(max-width:520px){
  .reserve-modal{padding:24px 20px;}
  .reserve-actions{flex-direction:column;}
}
</style>
</head>
<body>

<nav class="topbar">
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    BACK
  </button>
  <div class="topbar-logo" onclick="location.href='index.html'">
    <img src="assets/logo-13am.png" alt="13AM">
  </div>
  <span class="topbar-title">CART</span>
</nav>

<div class="wrap">
  <div class="page-label">
    <span class="title">Your Cart</span>
    <span class="desc" id="countLabel">empty</span>
  </div>

  <!-- 空状态 -->
  <div class="empty" id="emptyState">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 4h2l2.5 12h11l2-8h-13"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
    <div class="msg">Nothing here yet.</div>
    <div class="sub">YOUR CART IS WAITING.</div>
    <a href="index.html#product">← BACK TO SHOP</a>
  </div>

  <!-- 商品列表（隐藏，加入商品后显示） -->
  <div class="cart-list" id="cartList"></div>

  <!-- 合计 -->
  <div class="cart-total" id="cartTotal">
    <span class="label">SUBTOTAL</span>
    <span class="amount" id="totalAmount">¥ 0</span>
    <div class="cart-actions">
      <button class="checkout-btn clear-btn" type="button" onclick="clearAllCart()">CLEAR ALL</button>
      <button class="checkout-btn" onclick="openReserve()">RESERVE</button>
    </div>
  </div>
</div>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/cart.js"></script>
<script>
// 购物车数据统一走 window.Cart
let products = {};  // 从 products.json 加载

async function loadProducts(){
  try{
    const r = await fetch('products.json?_=' + Date.now());
    if(!r.ok) throw new Error('products.json 加载失败');
    const data = await r.json();
    const list = (data && data.products) ? data.products : [];
    const map = {};
    list.forEach(p=>{
      map[p.id] = {
        name: p.name,
        tag: p.tag || 'element series',
        price: p.price || 0,
        currency: p.currency || '¥',
        img: new URL(p.cover, location.href).href
      };
    });
    return map;
  }catch(err){
    console.warn('回退使用内置映射', err);
    return {
      '13-ring':     {name:'13 RING',    tag:'accessory', price:0, currency:'¥', img:new URL('assets/images/13ring.png', location.href).href},
      '13-ring-2':   {name:'13 RING II', tag:'accessory', price:0, currency:'¥', img:new URL('assets/images/13-ring-2.jpg', location.href).href},
      '13atm-tshirt':{name:'13ATM TEE',  tag:'clothing',  price:0, currency:'¥', img:new URL('assets/images/13atm-tshirt.png', location.href).href},
      'art-bag':     {name:'ART BAG',    tag:'bag',       price:0, currency:'¥', img:new URL('assets/images/art-bag.jpg', location.href).href},
      'bam-bag':     {name:'BAM BAG',    tag:'bag',       price:0, currency:'¥', img:new URL('assets/images/bam-bag.jpg', location.href).href},
      'bam-hat':     {name:'BAM HAT',    tag:'accessory', price:0, currency:'¥', img:new URL('assets/images/bam-hat.jpg', location.href).href},
      'polar-fleece':{name:'POLAR FLEECE',tag:'clothing', price:0, currency:'¥', img:new URL('assets/images/polar-fleece.jpg', location.href).href}
    };
  }
}

function render(){
  const list = document.getElementById('cartList');
  const total = document.getElementById('cartTotal');
  const empty = document.getElementById('emptyState');
  const label = document.getElementById('countLabel');
  const cart = window.Cart.getCart();

  if(cart.length === 0){
    list.style.display = 'none';
    total.style.display = 'none';
    empty.style.display = 'block';
    label.textContent = 'empty';
    document.getElementById('totalAmount').textContent = '¥ 0';
    return;
  }

  empty.style.display = 'none';
  list.style.display = 'flex';
  total.style.display = 'block';

  // 按条目计数（同款不同尺码算两条），同时统计件数
  const totalQty = cart.reduce((s,i)=>s + (i.qty||0), 0);
  label.textContent = cart.length + (cart.length === 1 ? ' item / ' : ' items / ') + totalQty + ' pcs';

  let subtotal = 0;
  list.innerHTML = cart.map((item, idx)=>{
    const p = products[item.id];
    if(!p) return '';
    const priceStr = p.price > 0 ? `${p.currency} ${(p.price * item.qty).toLocaleString()}` : `${p.currency} TBA`;
    if(p.price > 0) subtotal += p.price * item.qty;
    return `<div class="cart-item">
      <img src="${p.img}" alt="">
      <div>
        <div class="name">${p.name}</div>
        <div class="tag">— ${p.tag}${item.size ? ' · SIZE ' + item.size : ''}</div>
      </div>
      <div class="qty-box">
        <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
      </div>
      <div class="price">${priceStr}</div>
      <button class="remove" onclick="removeAt(${idx})">REMOVE</button>
    </div>`;
  }).join('');

  document.getElementById('totalAmount').textContent = subtotal > 0
    ? `¥ ${subtotal.toLocaleString()}`
    : '¥ TBA';
}

window.changeQty = function(idx, delta){
  if(!window.Cart) return;
  window.Cart.updateQtyAt(idx, delta);
};
window.removeAt = function(idx){
  if(!window.Cart) return;
  window.Cart.removeAt(idx);
};
window.clearAllCart = function(){
  if(!window.Cart) return;
  if(!confirm('Clear all items in cart?')) return;
  window.Cart.clearCart();
};

// 兼容 product.html / index.html 老页面通过 window.addToCart 跨页调（现在内部走 Cart.addToCart）
window.addToCart = function(id, opts){
  if(!window.Cart) return null;
  return window.Cart.addToCart(id, opts || {});
};

function checkout(){
  openReserve();
}

/* ========== 到货预留弹窗 ========== */
function openReserve(){
  const cart = window.Cart.getCart();
  if(!cart || cart.length === 0) return;

  // 如果已登录，预填用户名
  let preName = '';
  if(window.supabaseAuth){
    const st = window.supabaseAuth.getAuthState();
    if(st.loggedIn && st.user){
      preName = st.user.user_metadata?.name || st.user.email?.split('@')[0] || '';
    }
  }

  // 构建摘要
  const summaryHtml = cart.map(item=>{
    const p = products[item.id];
    if(!p) return '';
    const meta = [item.size && 'SIZE ' + item.size, p.tag].filter(Boolean).join(' · ');
    return `<div class="rs-item">
      <span class="rs-name">${p.name}<span class="rs-meta">${meta}</span></span>
      <span class="rs-qty">×${item.qty}</span>
    </div>`;
  }).join('');

  const html = `<div class="reserve-modal" id="reserveModal">
    <h2>到货预留</h2>
    <div class="reserve-sub">RESERVE · 我们会在商品到货后第一时间联系你</div>
    <div class="reserve-summary">${summaryHtml}</div>
    <div class="reserve-field">
      <label>姓名 / NAME</label>
      <input type="text" id="rvName" value="${preName.replace(/"/g,'&quot;')}" placeholder="你的称呼" maxlength="20">
    </div>
    <div class="reserve-field">
      <label>联系方式 / CONTACT</label>
      <input type="text" id="rvContact" placeholder="手机号 / 微信 / 邮箱" maxlength="40">
    </div>
    <div class="reserve-field">
      <label>备注 / NOTE（可选）</label>
      <textarea id="rvNote" placeholder="尺码偏好、到货时间要求等" maxlength="200"></textarea>
    </div>
    <div class="reserve-actions">
      <button class="btn-cancel" onclick="closeReserve()">CANCEL</button>
      <button class="btn-submit" id="rvSubmit" onclick="submitReserve()">SUBMIT</button>
    </div>
  </div>`;

  let overlay = document.getElementById('reserveOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'reserveOverlay';
    overlay.className = 'reserve-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = html;
  overlay.classList.add('show');
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeReserve();
  });
  // 自动聚焦
  setTimeout(()=>{
    const n = document.getElementById('rvName');
    if(n && !n.value) n.focus();
  }, 300);
}

function closeReserve(){
  const overlay = document.getElementById('reserveOverlay');
  if(overlay) overlay.classList.remove('show');
}

function submitReserve(){
  const name = (document.getElementById('rvName')?.value || '').trim();
  const contact = (document.getElementById('rvContact')?.value || '').trim();
  const note = (document.getElementById('rvNote')?.value || '').trim();
  if(!name){ document.getElementById('rvName').focus(); return; }
  if(!contact){ document.getElementById('rvContact').focus(); return; }

  const btn = document.getElementById('rvSubmit');
  if(btn) btn.disabled = true;

  const cart = window.Cart.getCart();
  const reservation = {
    id: 'rv_' + Date.now(),
    name, contact, note,
    items: cart.map(i=>({ id:i.id, name:products[i.id]?.name||i.id, size:i.size||'', qty:i.qty })),
    created_at: new Date().toISOString()
  };

  // 存到 localStorage
  try{
    const list = JSON.parse(localStorage.getItem('13am_reservations') || '[]');
    list.push(reservation);
    localStorage.setItem('13am_reservations', JSON.stringify(list));
  }catch(e){ console.warn('预留保存失败', e); }

  // 如果已登录，同步到 Supabase user_metadata.reservations
  if(window.supabaseAuth){
    const st = window.supabaseAuth.getAuthState();
    if(st.loggedIn && window.supabaseAuth.updateUserMetadata){
      const existing = st.user.user_metadata?.reservations || [];
      existing.push(reservation);
      window.supabaseAuth.updateUserMetadata({ reservations: existing }).catch(()=>{});
    }
  }

  // 显示成功页
  const overlay = document.getElementById('reserveOverlay');
  if(overlay){
    overlay.querySelector('.reserve-modal').innerHTML = `
      <div class="reserve-success">
        <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
        <h3>预留成功</h3>
        <p>我们会在商品到货后通过你留下的联系方式第一时间通知你。<br>RESERVATION CONFIRMED.</p>
        <div class="reserve-actions">
          <button class="btn-submit" style="flex:1" onclick="closeReserve(); window.Cart.clearCart();">DONE</button>
        </div>
      </div>`;
  }
}

// 启动：加载映射 -> 订阅购物车变更 -> 首次渲染
loadProducts().then(m=>{
  products = m;
  render();
  // 订阅所有购物车变更（本页操作/跨 tab storage/登录合并/云端写回）自动重渲染
  if(window.Cart){
    window.Cart.onCartChange(()=> render());
  }
});
</script>
<style>
  #authBadge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:2px 8px 2px 2px;
    border-radius:999px;
    background:rgba(255,255,255,0.02);
  }
  #authBadge .ab-avatar{
    width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.04);color:var(--text-dim);
  }
  #authBadge .ab-avatar svg{
    width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  }
  #authBadge .ab-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  #authBadge .ab-avatar .ab-fb{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2a3a8a,#4a5fc8);color:#fff;
    font-family:'Fraunces',serif;font-size:11px;font-weight:500;letter-spacing:0;
  }
  #authBadge .ab-text{
    display:inline-block;
    max-width:120px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    vertical-align:middle;
    line-height:1.2;
  }
</style>
<script>
(function(){
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const DEFAULT_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>';
  function renderAuthBadge(state){
    let badge = document.getElementById('authBadge');
    if(!badge){
      badge = document.createElement('div');
      badge.id = 'authBadge';
      badge.style.cssText = 'position:fixed;top:20px;right:24px;z-index:100;font-size:12px;letter-spacing:0.1em;color:var(--text-dim);cursor:pointer;font-family:var(--serif);transition:color 0.3s ease,transform 0.3s ease;';
      badge.onmouseenter = ()=>{ badge.style.color = 'var(--text)'; badge.style.transform='translateY(-1px)'; };
      badge.onmouseleave = ()=>{ badge.style.color = 'var(--text-dim)'; badge.style.transform='translateY(0)'; };
      document.body.appendChild(badge);
    }
    if(state.loggedIn && state.user){
      const md = state.user.user_metadata || {};
      const fullName = md.name || state.user.email?.split('@')[0] || 'USER';
      const shortName = fullName.length > 12 ? fullName.slice(0,12) + '…' : fullName;
      const initials = (fullName.trim().slice(0,1)||'U').toUpperCase();
      const avatarUrl = md.avatar_url || '';
      const avHtml = avatarUrl
        ? `<img src="${esc(avatarUrl)}" alt="${esc(fullName)}">`
        : `<span class="ab-fb">${esc(initials)}</span>`;
      badge.innerHTML = `<span class="ab-avatar">${avHtml}</span><span class="ab-text" title="${esc(fullName)}">${esc(shortName)}</span>`;
      badge.title = fullName + ' · 我的账户';
      badge.onclick = ()=> location.href = 'account.html';
    } else {
      badge.innerHTML = `<span class="ab-avatar">${DEFAULT_SVG}</span><span class="ab-text">LOG IN</span>`;
      badge.title = '登录 / 注册';
      badge.onclick = ()=>{ location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname + location.search); };
    }
  }
  (async function(){
    if(!window.supabaseAuth) return;
    await window.supabaseAuth.initSupabase();
    renderAuthBadge(window.supabaseAuth.getAuthState());
    window.supabaseAuth.onAuthStateChange(()=> renderAuthBadge(window.supabaseAuth.getAuthState()));
  })();
})();
</script>
</body>
</html>
